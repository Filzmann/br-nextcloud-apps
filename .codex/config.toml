sandbox_mode = "workspace-write"
approval_policy = "on-request"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents.routine_worker]
description = "ROUTINE execution for narrow, deterministic work without architecture or risk decisions."
config_file = "agents/routine_worker.toml"

[agents.standard_worker]
description = "STANDARD execution for normal development within established contracts and repository boundaries."
config_file = "agents/standard_worker.toml"

[agents.complex_worker]
description = "COMPLEX execution for ambiguous, architectural, security-sensitive, privacy-sensitive, migration, or cross-app work."
config_file = "agents/complex_worker.toml"

[agents.critical_reviewer]
description = "CRITICAL_REVIEW execution for independent read-only review of high-impact completed work."
config_file = "agents/critical_reviewer.toml"

[agents.reviewer]
description = "Codex approval-review support role only; it does not execute classified tasks."
config_file = "agents/reviewer.toml"
