name: Wiederverwendbares Staging-Deployment

on:
  workflow_call:
    inputs:
      app-id:
        description: Nextcloud-App-ID des aufrufenden Repositorys
        required: true
        type: string
      source-repository:
        description: Repository für einen ausdrücklich ausgestellten Candidate
        required: false
        type: string
        default: ''
      source-ref:
        description: Vollständiger Candidate-Commit
        required: false
        type: string
        default: ''
      candidate-id:
        description: Ausgestellte Candidate-ID; leer für nicht abnahmefähige Legacy-Deployments
        required: false
        type: string
        default: ''
      candidate-source-commit:
        description: Im Candidate gebundener Source-Commit
        required: false
        type: string
        default: ''
      candidate-build-id:
        description: Im Candidate gebundene Build-ID
        required: false
        type: string
        default: ''
      candidate-build-sha256:
        description: Im Candidate gebundener Archivdigest
        required: false
        type: string
        default: ''
      candidate-staging-target:
        description: Im Candidate gebundenes autoritatives Staging-Ziel
        required: false
        type: string
        default: ''
      staging-target:
        description: Vertragliche Ziel-ID teamcloud oder br-staging
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.app-id }} auf Staging installieren
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.staging-target == 'teamcloud' && 'staging' || 'staging-br' }}
    concurrency:
      group: staging-${{ inputs.staging-target }}
      cancel-in-progress: false
    env:
      APP_ID: ${{ inputs.app-id }}
      DEPLOYMENT_STAGING_TARGET: ${{ inputs.staging-target }}
      CANDIDATE_STAGING_TARGET: ${{ inputs.candidate-staging-target }}
      SOURCE_REF_INPUT: ${{ inputs.source-ref }}
      CANDIDATE_ID: ${{ inputs.candidate-id }}
      CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate-source-commit }}
      CANDIDATE_BUILD_ID: ${{ inputs.candidate-build-id }}
      CANDIDATE_BUILD_SHA256: ${{ inputs.candidate-build-sha256 }}
    steps:
      - name: Zentrale Deploymentwerkzeuge auschecken
        uses: actions/checkout@v7
        with:
          repository: Filzmann/br-nextcloud-apps
          ref: main
          path: control

      - name: Deploymentparameter validieren
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          BR_STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          BR_STAGING_GATE_COMMAND: ${{ vars.STAGING_GATE_COMMAND }}
        run: |
          set -euo pipefail
          bash control/scripts/validate-staging-deployment-inputs \
            --app-id "$APP_ID" \
            --deployment-target "$DEPLOYMENT_STAGING_TARGET" \
            --candidate-staging-target "$CANDIDATE_STAGING_TARGET" \
            --source-ref "$SOURCE_REF_INPUT" \
            --candidate-id "$CANDIDATE_ID" \
            --candidate-source-commit "$CANDIDATE_SOURCE_COMMIT" \
            --candidate-build-id "$CANDIDATE_BUILD_ID" \
            --candidate-build-sha256 "$CANDIDATE_BUILD_SHA256" >/dev/null
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || {
            echo 'Mindestens ein erforderliches Staging-Secret fehlt.' >&2
            exit 2
          }
          case "$DEPLOYMENT_STAGING_TARGET" in
            teamcloud)
              echo 'STAGING_HOST=teamcloud.simonbeyer.de' >> "$GITHUB_ENV"
              echo 'STAGING_USER=filzmann' >> "$GITHUB_ENV"
              echo 'STAGING_BASE_URL=https://teamcloud.simonbeyer.de' >> "$GITHUB_ENV"
              echo 'STAGING_GATE_COMMAND=teamcloud-staging' >> "$GITHUB_ENV"
              ;;
            br-staging)
              [[ "$BR_STAGING_SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || {
                echo 'GitHub-Environment staging-br benötigt eine gültige Variable STAGING_SSH_USER.' >&2
                exit 2
              }
              [[ "$BR_STAGING_GATE_COMMAND" =~ ^[a-z][a-z0-9-]{1,31}$ ]] || {
                echo 'GitHub-Environment staging-br benötigt eine gültige Variable STAGING_GATE_COMMAND.' >&2
                exit 2
              }
              echo 'STAGING_HOST=staging.betriebsrat-ad.de' >> "$GITHUB_ENV"
              echo "STAGING_USER=$BR_STAGING_SSH_USER" >> "$GITHUB_ENV"
              echo 'STAGING_BASE_URL=https://staging.betriebsrat-ad.de' >> "$GITHUB_ENV"
              echo "STAGING_GATE_COMMAND=$BR_STAGING_GATE_COMMAND" >> "$GITHUB_ENV"
              ;;
          esac

      - name: App-Commit auschecken
        uses: actions/checkout@v7
        with:
          path: app
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Gepinnte Security-Scanner
        run: |
          set -euo pipefail
          bash control/scripts/run-security-scanners \
            --repository "parent=$GITHUB_WORKSPACE/control" \
            --repository "$APP_ID=$GITHUB_WORKSPACE/app" \
            --evidence-file "$RUNNER_TEMP/security-scans.json"

      - name: Geprüftes App-Archiv bauen
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git -C app rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/staging-package"
          bash control/scripts/package-staging-app.sh \
            --app-root app \
            --app-id "$APP_ID" \
            --commit "$SOURCE_COMMIT" \
            --archive "$RUNNER_TEMP/staging-package/$APP_ID.tar.gz" \
            --metadata "$RUNNER_TEMP/staging-package/metadata.env"
          source "$RUNNER_TEMP/staging-package/metadata.env"
          DEPLOYMENT_MODE="$(bash control/scripts/validate-staging-deployment-inputs \
            --app-id "$APP_ID" \
            --deployment-target "$DEPLOYMENT_STAGING_TARGET" \
            --candidate-staging-target "$CANDIDATE_STAGING_TARGET" \
            --source-ref "$SOURCE_REF_INPUT" \
            --candidate-id "$CANDIDATE_ID" \
            --candidate-source-commit "$CANDIDATE_SOURCE_COMMIT" \
            --candidate-build-id "$CANDIDATE_BUILD_ID" \
            --candidate-build-sha256 "$CANDIDATE_BUILD_SHA256" \
            --actual-source-commit "$SOURCE_COMMIT" \
            --actual-build-sha256 "$SHA256")"
          echo "DEPLOYMENT_MODE=$DEPLOYMENT_MODE" >> "$GITHUB_ENV"

      - name: SSH-Vertrauen einrichten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/staging-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/staging-ssh/key" "$RUNNER_TEMP/staging-ssh/known_hosts"

      - name: Archiv über SSH-Gate installieren
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/staging-package/metadata.env"
          SOURCE_COMMIT="$(git -C app rev-parse HEAD)"
          DEPLOYMENT_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${APP_ID}"

          target="$STAGING_USER@$STAGING_HOST"

          ssh_options=(
            -i "$RUNNER_TEMP/staging-ssh/key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-ssh/known_hosts"
          )

          ssh "${ssh_options[@]}" \
            "$target" \
            "${STAGING_GATE_COMMAND} upload ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${APP_ID}" \
            < "$RUNNER_TEMP/staging-package/$APP_ID.tar.gz"

          if [[ "$DEPLOYMENT_MODE" == authoritative-candidate ]]; then
            ssh "${ssh_options[@]}" \
              "$target" \
              "${STAGING_GATE_COMMAND} install ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${APP_ID} ${SOURCE_COMMIT} ${SHA256} ${CANDIDATE_ID} ${DEPLOYMENT_ID} ${CANDIDATE_BUILD_ID}"
          else
            ssh "${ssh_options[@]}" \
              "$target" \
              "${STAGING_GATE_COMMAND} install ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${APP_ID} ${SOURCE_COMMIT} ${SHA256}"
          fi

      - name: Öffentliche Assets prüfen
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/staging-package/metadata.env"
          css_headers="$RUNNER_TEMP/css-headers"
          js_headers="$RUNNER_TEMP/js-headers"
          curl -fsS -o /dev/null -D "$css_headers" "$STAGING_BASE_URL/custom_apps/$APP_ID/$CSS_ASSET"
          curl -fsS -o /dev/null -D "$js_headers" "$STAGING_BASE_URL/custom_apps/$APP_ID/$JS_ASSET"
          grep -Eiq '^content-type:[[:space:]]*text/css([;[:space:]]|$)' "$css_headers"
          grep -Eiq '^content-type:[[:space:]]*(application|text)/(javascript|x-javascript)([;[:space:]]|$)' "$js_headers"

      - name: Candidate-Deployment nach HTTPS-Smoke verifizieren
        if: ${{ inputs.candidate-id != '' }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_MODE" != authoritative-candidate ]]; then
            exit 0
          fi
          source "$RUNNER_TEMP/staging-package/metadata.env"
          SOURCE_COMMIT="$(git -C app rev-parse HEAD)"
          DEPLOYMENT_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${APP_ID}"
          target="$STAGING_USER@$STAGING_HOST"
          ssh \
            -i "$RUNNER_TEMP/staging-ssh/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-ssh/known_hosts" \
            "$target" \
            "${STAGING_GATE_COMMAND} verify ${APP_ID} ${CANDIDATE_ID} ${DEPLOYMENT_ID} ${SOURCE_COMMIT} ${SHA256} ${CANDIDATE_BUILD_ID}"

      - name: Temporäre Serverdateien entfernen
        if: always()
        run: |
          set -euo pipefail

          target="$STAGING_USER@$STAGING_HOST"

          if [[ -f "$RUNNER_TEMP/staging-ssh/key" && -f "$RUNNER_TEMP/staging-ssh/known_hosts" ]]; then
            ssh \
              -i "$RUNNER_TEMP/staging-ssh/key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/staging-ssh/known_hosts" \
              "$target" \
              "${STAGING_GATE_COMMAND} cleanup ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} ${APP_ID}" || true
          fi
